<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Đọc sách</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0A84FF;
  --orange:#FF9F0A;
  --green:#30D158;
  --purple:#BF5AF2;
  --pink:#FF375F;
  --glass:rgba(255,255,255,.06);
  --glass-strong:rgba(255,255,255,.1);
  --sep:rgba(255,255,255,.06);
}
*{margin:0;padding:0;box-sizing:border-box;}
::-webkit-scrollbar{display:none;}
body{
  background:#000;
  font-family:'Inter',sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.app-shell{
  max-width:430px;
  width:100%;
  height:100vh;
  max-height:844px;
  background:#000;
  display:flex;
  flex-direction:column;
  border-radius:44px;
  overflow:hidden;
  position:relative;
}

/* Header */
.app-header{
  padding:16px 20px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--sep);
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(20px);
  flex-shrink:0;
}
.app-header .title{
  font-size:22px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:8px;
}
.app-header .title i{
  color:var(--orange);
}
.app-header .action-btn{
  border:none;
  background:rgba(255,255,255,.06);
  color:#fff;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:16px;
  cursor:pointer;
  transition:all .2s;
  display:flex;
  align-items:center;
  justify-content:center;
}
.app-header .action-btn:active{
  transform:scale(.9);
  background:rgba(255,255,255,.12);
}

.app-body{
  flex:1;
  padding:12px 16px 16px;
  overflow-y:auto;
  background:#000;
}

/* Search */
.book-search{
  height:40px;
  border-radius:12px;
  background:var(--glass);
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:10px;
  margin-bottom:16px;
  border:1px solid transparent;
  transition:all .3s;
}
.book-search:focus-within{
  border-color:rgba(255,159,10,.3);
}
.book-search i{
  color:rgba(255,255,255,.2);
  font-size:16px;
}
.book-search input{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  color:white;
  font-size:14px;
  font-family:inherit;
}
.book-search input::placeholder{
  color:rgba(255,255,255,.2);
}

/* Categories */
.book-categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
  margin-bottom:16px;
}
.book-categories button{
  border:none;
  white-space:nowrap;
  padding:6px 16px;
  border-radius:20px;
  background:var(--glass);
  color:rgba(255,255,255,.4);
  cursor:pointer;
  font-size:12px;
  font-weight:600;
  transition:all .3s;
  font-family:inherit;
}
.book-categories button:active{
  transform:scale(.95);
}
.book-categories button.active{
  background:var(--orange);
  color:#fff;
}
.book-categories button i{
  margin-right:4px;
}

/* Book grid */
.book-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}
.book-card{
  background:var(--glass);
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  transition:all .3s;
  border:1px solid transparent;
}
.book-card:active{
  transform:scale(.97);
  border-color:rgba(255,159,10,.2);
}
.book-cover{
  width:100%;
  aspect-ratio:3/4;
  background:linear-gradient(135deg,#1a2a3a,#0a1a2a);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  position:relative;
}
.book-cover .badge{
  position:absolute;
  top:8px;
  right:8px;
  background:var(--orange);
  padding:2px 10px;
  border-radius:12px;
  font-size:9px;
  font-weight:700;
  color:#fff;
}
.book-info{
  padding:10px 12px 12px;
}
.book-title{
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.book-author{
  font-size:11px;
  color:rgba(255,255,255,.35);
  margin-top:2px;
}
.book-rating{
  font-size:11px;
  color:#FFD60A;
  margin-top:4px;
}
.book-rating .reviews{
  color:rgba(255,255,255,.2);
  font-size:9px;
  margin-left:4px;
}
.book-progress{
  margin-top:8px;
  height:3px;
  background:rgba(255,255,255,.06);
  border-radius:4px;
  overflow:hidden;
}
.book-progress .fill{
  height:100%;
  background:var(--orange);
  border-radius:4px;
  transition:width .5s;
}

/* Reader */
.book-reader{
  position:absolute;
  inset:0;
  background:#0a0a0f;
  z-index:50;
  display:none;
  flex-direction:column;
  animation:slideUp .35s ease;
}
@keyframes slideUp{
  0%{transform:translateY(30px);opacity:0;}
  100%{transform:translateY(0);opacity:1;}
}
.book-reader.open{
  display:flex;
}
.reader-header{
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--sep);
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(20px);
  flex-shrink:0;
}
.reader-header .back{
  border:none;
  background:transparent;
  color:var(--orange);
  font-size:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:4px;
  font-weight:600;
  font-family:inherit;
}
.reader-header .back:active{
  opacity:.7;
}
.reader-header .title{
  font-size:15px;
  font-weight:700;
}
.reader-header .settings{
  border:none;
  background:transparent;
  color:rgba(255,255,255,.3);
  font-size:18px;
  cursor:pointer;
}
.reader-body{
  flex:1;
  padding:30px 24px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.reader-body .chapter-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:16px;
  color:var(--orange);
}
.reader-body .content{
  font-size:16px;
  line-height:1.8;
  color:rgba(255,255,255,.85);
}
.reader-body .content p{
  margin-bottom:12px;
}
.reader-footer{
  padding:12px 16px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid var(--sep);
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(20px);
  flex-shrink:0;
}
.reader-footer .page-info{
  font-size:12px;
  color:rgba(255,255,255,.3);
}
.reader-footer .controls{
  display:flex;
  gap:12px;
}
.reader-footer .controls button{
  border:none;
  background:var(--glass);
  color:#fff;
  padding:6px 16px;
  border-radius:12px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
  font-family:inherit;
}
.reader-footer .controls button:active{
  transform:scale(.95);
  background:var(--glass-strong);
}
.reader-footer .controls button.primary{
  background:var(--orange);
  color:#fff;
}

/* Toast */
.toast{
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(30,30,34,.95);
  backdrop-filter:blur(20px);
  padding:10px 20px;
  border-radius:14px;
  font-size:13px;
  color:#fff;
  opacity:0;
  transition:all .3s;
  pointer-events:none;
  z-index:2000;
  border:1px solid var(--sep);
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* Responsive */
@media (max-width:430px){
  .app-shell{
    max-height:100vh;
    border-radius:0;
  }
}
@media (max-width:380px){
  .book-grid{
    gap:10px;
  }
  .book-title{
    font-size:12px;
  }
  .reader-body{
    padding:20px 16px;
  }
  .reader-body .content{
    font-size:14px;
  }
}
</style>
</head>
<body>
<div class="app-shell">

  <!-- HEADER -->
  <div class="app-header">
    <div class="title"><i class="bi bi-book-fill"></i> Đọc sách</div>
    <button class="action-btn" onclick="showToast('📚 Đang tải thư viện...')"><i class="bi bi-arrow-clockwise"></i></button>
  </div>

  <!-- BODY -->
  <div class="app-body">
    
    <!-- Search -->
    <div class="book-search">
      <i class="bi bi-search"></i>
      <input id="bookSearch" type="text" placeholder="Tìm kiếm sách..." oninput="searchBooks()">
    </div>

    <!-- Categories -->
    <div class="book-categories">
      <button class="active" onclick="filterBooks('all', this)"><i class="bi bi-grid-fill"></i> Tất cả</button>
      <button onclick="filterBooks('fiction', this)"><i class="bi bi-pencil-fill"></i> Tiểu thuyết</button>
      <button onclick="filterBooks('science', this)"><i class="bi bi-rocket-fill"></i> Khoa học</button>
      <button onclick="filterBooks('business', this)"><i class="bi bi-briefcase-fill"></i> Kinh doanh</button>
      <button onclick="filterBooks('self', this)"><i class="bi bi-person-fill"></i> Phát triển</button>
    </div>

    <!-- Book Grid -->
    <div class="book-grid" id="bookGrid">
      <!-- Books rendered by JS -->
    </div>
  </div>

  <!-- READER -->
  <div class="book-reader" id="bookReader">
    <div class="reader-header">
      <button class="back" onclick="closeReader()"><i class="bi bi-chevron-left"></i> Quay lại</button>
      <span class="title" id="readerTitle">Tên sách</span>
      <button class="settings" onclick="showToast('⚙️ Cài đặt đọc sách')"><i class="bi bi-sliders"></i></button>
    </div>
    <div class="reader-body">
      <div class="chapter-title" id="readerChapter">Chương 1</div>
      <div class="content" id="readerContent">
        <p>Nội dung đang được tải...</p>
      </div>
    </div>
    <div class="reader-footer">
      <span class="page-info" id="pageInfo">Trang 1 / 10</span>
      <div class="controls">
        <button onclick="prevPage()"><i class="bi bi-chevron-left"></i> Trước</button>
        <button class="primary" onclick="nextPage()">Sau <i class="bi bi-chevron-right"></i></button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>
</div>

<script>
// ================= BOOK DATA =================
const books = [
  {
    id: 1,
    title: 'Nhà giả kim',
    author: 'Paulo Coelho',
    category: 'fiction',
    emoji: '🏜️',
    rating: 4.8,
    reviews: 12500,
    progress: 65,
    chapters: [
      { title: 'Chương 1: Khởi đầu', content: 'Santiago là một cậu bé chăn cừu người Tây Ban Nha...' },
      { title: 'Chương 2: Giấc mơ', content: 'Đêm đó, Santiago nằm mơ thấy một kho báu...' },
      { title: 'Chương 3: Hành trình', content: 'Cậu quyết định bán đàn cừu và lên đường...' }
    ]
  },
  {
    id: 2,
    title: 'Tư duy nhanh và chậm',
    author: 'Daniel Kahneman',
    category: 'science',
    emoji: '🧠',
    rating: 4.6,
    reviews: 8200,
    progress: 30,
    chapters: [
      { title: 'Chương 1: Hai hệ thống', content: 'Hệ thống 1 hoạt động nhanh và tự động...' },
      { title: 'Chương 2: Hệ thống 2', content: 'Hệ thống 2 đòi hỏi sự tập trung...' }
    ]
  },
  {
    id: 3,
    title: 'Đắc nhân tâm',
    author: 'Dale Carnegie',
    category: 'self',
    emoji: '🤝',
    rating: 4.9,
    reviews: 15600,
    progress: 45,
    chapters: [
      { title: 'Chương 1: Nguyên tắc cơ bản', content: 'Đừng chỉ trích, lên án hay than phiền...' },
      { title: 'Chương 2: Gây thiện cảm', content: 'Hãy mỉm cười và nhớ tên người khác...' }
    ]
  },
  {
    id: 4,
    title: 'Dune - Xứ cát',
    author: 'Frank Herbert',
    category: 'fiction',
    emoji: '🏜️',
    rating: 4.7,
    reviews: 9800,
    progress: 20,
    chapters: [
      { title: 'Chương 1: Arrakis', content: 'Hành tinh sa mạc Arrakis là nơi sản xuất...' },
      { title: 'Chương 2: Gia tộc Atreides', content: 'Gia tộc Atreides nhận quyền cai trị...' }
    ]
  },
  {
    id: 5,
    title: 'Nghệ thuật chiến tranh',
    author: 'Sun Tzu',
    category: 'business',
    emoji: '⚔️',
    rating: 4.5,
    reviews: 5600,
    progress: 10,
    chapters: [
      { title: 'Chương 1: Kế hoạch', content: 'Chiến tranh là vấn đề quan trọng...' },
      { title: 'Chương 2: Tác chiến', content: 'Nếu biết địch và biết ta...' }
    ]
  },
  {
    id: 6,
    title: 'Atomic Habits',
    author: 'James Clear',
    category: 'self',
    emoji: '⚡',
    rating: 4.8,
    reviews: 11200,
    progress: 75,
    chapters: [
      { title: 'Chương 1: Thói quen', content: 'Thói quen là các quyết định nhỏ...' },
      { title: 'Chương 2: Quy tắc 1%', content: 'Cải thiện 1% mỗi ngày...' }
    ]
  }
];

// ================= STATE =================
let currentCategory = 'all';
let currentBookIndex = 0;
let currentChapterIndex = 0;

// ================= RENDER =================
function renderBooks() {
  const grid = document.getElementById('bookGrid');
  const search = document.getElementById('bookSearch').value.toLowerCase().trim();
  
  const filtered = books.filter(book => {
    const matchCategory = currentCategory === 'all' || book.category === currentCategory;
    const matchSearch = book.title.toLowerCase().includes(search) || 
                        book.author.toLowerCase().includes(search);
    return matchCategory && matchSearch;
  });
  
  if (filtered.length === 0) {
    grid.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:40px 0;color:rgba(255,255,255,.2);font-size:14px;">
        <i class="bi bi-book" style="font-size:32px;display:block;margin-bottom:8px;color:rgba(255,255,255,.05);"></i>
        Không tìm thấy sách nào
      </div>
    `;
    return;
  }
  
  grid.innerHTML = filtered.map((book, idx) => `
    <div class="book-card" onclick="openBook(${books.indexOf(book)})">
      <div class="book-cover" style="background:${getBookColor(book.id)}">
        ${book.emoji}
        ${book.progress > 0 ? `<span class="badge">${book.progress}%</span>` : ''}
      </div>
      <div class="book-info">
        <div class="book-title">${book.title}</div>
        <div class="book-author">${book.author}</div>
        <div class="book-rating">
          ${'★'.repeat(Math.floor(book.rating))}${book.rating % 1 >= 0.5 ? '☆' : ''}
          <span class="reviews">${formatNumber(book.reviews)}</span>
        </div>
        <div class="book-progress">
          <div class="fill" style="width:${book.progress}%;"></div>
        </div>
      </div>
    </div>
  `).join('');
}

function getBookColor(id) {
  const colors = [
    'linear-gradient(135deg,#1a2a3a,#2a4a5a)',
    'linear-gradient(135deg,#2a1a3a,#4a2a5a)',
    'linear-gradient(135deg,#1a3a2a,#2a5a4a)',
    'linear-gradient(135deg,#3a1a1a,#5a2a2a)',
    'linear-gradient(135deg,#1a1a3a,#2a2a5a)',
    'linear-gradient(135deg,#3a2a1a,#5a4a2a)'
  ];
  return colors[(id - 1) % colors.length];
}

function formatNumber(num) {
  if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
  return num;
}

// ================= FILTER & SEARCH =================
function filterBooks(category, btn) {
  currentCategory = category;
  document.querySelectorAll('.book-categories button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderBooks();
}

function searchBooks() {
  renderBooks();
}

// ================= READER =================
function openBook(index) {
  currentBookIndex = index;
  currentChapterIndex = 0;
  const book = books[index];
  if (!book) return;
  
  document.getElementById('readerTitle').textContent = book.title;
  document.getElementById('bookReader').classList.add('open');
  renderChapter();
  showToast(`📖 Đang đọc: ${book.title}`);
}

function closeReader() {
  document.getElementById('bookReader').classList.remove('open');
}

function renderChapter() {
  const book = books[currentBookIndex];
  if (!book) return;
  const chapter = book.chapters[currentChapterIndex];
  if (!chapter) return;
  
  document.getElementById('readerChapter').textContent = chapter.title;
  document.getElementById('readerContent').innerHTML = chapter.content.split('\n').map(p => 
    `<p>${p}</p>`
  ).join('');
  document.getElementById('pageInfo').textContent = 
    `Trang ${currentChapterIndex + 1} / ${book.chapters.length}`;
}

function nextPage() {
  const book = books[currentBookIndex];
  if (!book) return;
  if (currentChapterIndex < book.chapters.length - 1) {
    currentChapterIndex++;
    renderChapter();
  } else {
    showToast('📚 Bạn đã đọc hết cuốn sách này!');
  }
}

function prevPage() {
  if (currentChapterIndex > 0) {
    currentChapterIndex--;
    renderChapter();
  } else {
    showToast('📖 Đây là trang đầu tiên');
  }
}

// ================= TOAST =================
function showToast(message) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ================= KEYBOARD SHORTCUTS =================
document.addEventListener('keydown', function(e) {
  if (document.getElementById('bookReader').classList.contains('open')) {
    if (e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault();
      nextPage();
    }
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      prevPage();
    }
    if (e.key === 'Escape') {
      closeReader();
    }
  }
  if (e.key === '/' && !e.ctrlKey && !e.metaKey) {
    const search = document.getElementById('bookSearch');
    if (document.activeElement !== search) {
      e.preventDefault();
      search.focus();
    }
  }
});

// ================= INIT =================
renderBooks();
</script>
</body>
</html>
