<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Xem phim</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0A84FF;
  --red:#FF453A;
  --orange:#FF9F0A;
  --green:#30D158;
  --purple:#BF5AF2;
  --glass:rgba(255,255,255,.06);
  --glass-strong:rgba(255,255,255,.1);
  --sep:rgba(255,255,255,.06);
}
*{margin:0;padding:0;box-sizing:border-box;}
::-webkit-scrollbar{display:none;}
body{
  background:#000;
  font-family:'Inter',sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.app-shell{
  max-width:430px;
  width:100%;
  height:100vh;
  max-height:844px;
  background:#000;
  display:flex;
  flex-direction:column;
  border-radius:44px;
  overflow:hidden;
  position:relative;
}

.app-header{
  padding:16px 20px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--sep);
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(20px);
  flex-shrink:0;
}
.app-header .title{
  font-size:22px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:8px;
}
.app-header .title i{
  color:var(--red);
}
.app-header .action-btn{
  border:none;
  background:rgba(255,255,255,.06);
  color:#fff;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:16px;
  cursor:pointer;
  transition:all .2s;
  display:flex;
  align-items:center;
  justify-content:center;
}
.app-header .action-btn:active{
  transform:scale(.9);
  background:rgba(255,255,255,.12);
}

.app-body{
  flex:1;
  padding:12px 16px 16px;
  overflow-y:auto;
  background:#000;
}

.movie-search{
  height:40px;
  border-radius:12px;
  background:var(--glass);
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:10px;
  margin-bottom:16px;
  border:1px solid transparent;
  transition:all .3s;
}
.movie-search:focus-within{
  border-color:rgba(255,69,58,.3);
}
.movie-search i{
  color:rgba(255,255,255,.2);
  font-size:16px;
}
.movie-search input{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  color:white;
  font-size:14px;
  font-family:inherit;
}
.movie-search input::placeholder{
  color:rgba(255,255,255,.2);
}

.movie-categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
  margin-bottom:16px;
}
.movie-categories button{
  border:none;
  white-space:nowrap;
  padding:6px 16px;
  border-radius:20px;
  background:var(--glass);
  color:rgba(255,255,255,.4);
  cursor:pointer;
  font-size:12px;
  font-weight:600;
  transition:all .3s;
  font-family:inherit;
}
.movie-categories button:active{
  transform:scale(.95);
}
.movie-categories button.active{
  background:var(--red);
  color:#fff;
}
.movie-categories button i{
  margin-right:4px;
}

.movie-featured{
  border-radius:16px;
  overflow:hidden;
  margin-bottom:18px;
  position:relative;
  cursor:pointer;
  transition:all .3s;
}
.movie-featured:active{
  transform:scale(.98);
}
.movie-featured .poster{
  width:100%;
  aspect-ratio:16/9;
  background:linear-gradient(135deg,#1a1a2e,#2a1a3a);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  position:relative;
  background-size:cover;
  background-position:center;
}
.movie-featured .poster .play-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.3);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transition:all .3s;
}
.movie-featured:hover .poster .play-overlay{
  opacity:1;
}
.movie-featured .poster .play-overlay i{
  font-size:48px;
  color:#fff;
  background:rgba(255,255,255,.15);
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.movie-featured .info{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:40px 16px 16px;
  background:linear-gradient(to top,rgba(0,0,0,.9),transparent);
}
.movie-featured .info .title{
  font-size:20px;
  font-weight:800;
}
.movie-featured .info .meta{
  display:flex;
  gap:12px;
  font-size:12px;
  color:rgba(255,255,255,.5);
  margin-top:4px;
}
.movie-featured .info .meta .tag{
  background:var(--red);
  color:#fff;
  padding:2px 10px;
  border-radius:12px;
  font-size:10px;
  font-weight:700;
}
.movie-featured .info .desc{
  font-size:13px;
  color:rgba(255,255,255,.5);
  margin-top:6px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.movie-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.movie-card{
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:all .3s;
  background:var(--glass);
}
.movie-card:active{
  transform:scale(.97);
}
.movie-card .poster{
  width:100%;
  aspect-ratio:2/3;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  position:relative;
  background-size:cover;
  background-position:center;
}
.movie-card .poster .rating{
  position:absolute;
  top:8px;
  right:8px;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(10px);
  padding:2px 8px;
  border-radius:10px;
  font-size:11px;
  font-weight:700;
  color:#FFD60A;
}
.movie-card .info{
  padding:10px 12px 12px;
}
.movie-card .info .title{
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.movie-card .info .year{
  font-size:11px;
  color:rgba(255,255,255,.35);
  margin-top:2px;
}
.movie-card .info .genres{
  display:flex;
  gap:4px;
  margin-top:4px;
  flex-wrap:wrap;
}
.movie-card .info .genres span{
  font-size:9px;
  color:rgba(255,255,255,.3);
  background:var(--glass);
  padding:2px 8px;
  border-radius:8px;
}

.movie-detail{
  position:absolute;
  inset:0;
  background:#0a0a0f;
  z-index:50;
  display:none;
  flex-direction:column;
  animation:slideUp .35s ease;
}
@keyframes slideUp{
  0%{transform:translateY(30px);opacity:0;}
  100%{transform:translateY(0);opacity:1;}
}
.movie-detail.open{
  display:flex;
}
.detail-header{
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--sep);
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(20px);
  flex-shrink:0;
}
.detail-header .back{
  border:none;
  background:transparent;
  color:var(--red);
  font-size:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:4px;
  font-weight:600;
  font-family:inherit;
}
.detail-header .back:active{
  opacity:.7;
}
.detail-header .title{
  font-size:16px;
  font-weight:700;
  flex:1;
}
.detail-body{
  flex:1;
  overflow-y:auto;
  padding:16px;
}
.detail-poster{
  width:100%;
  aspect-ratio:16/9;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:64px;
  position:relative;
  overflow:hidden;
  background-size:cover;
  background-position:center;
}
.detail-poster .play-btn{
  position:absolute;
  width:64px;
  height:64px;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(10px);
  border:2px solid rgba(255,255,255,.2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  color:#fff;
  cursor:pointer;
  transition:all .3s;
}
.detail-poster .play-btn:active{
  transform:scale(.9);
}
.detail-info{
  margin-top:16px;
}
.detail-info .title{
  font-size:22px;
  font-weight:800;
}
.detail-info .meta{
  display:flex;
  gap:12px;
  font-size:13px;
  color:rgba(255,255,255,.4);
  margin-top:4px;
  flex-wrap:wrap;
}
.detail-info .meta .dot{
  color:rgba(255,255,255,.15);
}
.detail-info .rating-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:6px;
}
.detail-info .rating-row .stars{
  color:#FFD60A;
  font-size:14px;
}
.detail-info .rating-row .score{
  font-size:14px;
  font-weight:700;
}
.detail-info .rating-row .reviews{
  font-size:12px;
  color:rgba(255,255,255,.3);
}
.detail-info .plot{
  font-size:14px;
  line-height:1.7;
  color:rgba(255,255,255,.7);
  margin-top:12px;
}
.detail-actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}
.detail-actions button{
  flex:1;
  padding:12px;
  border-radius:14px;
  border:none;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:all .2s;
  font-family:inherit;
}
.detail-actions button:active{
  transform:scale(.97);
}
.detail-actions .watch{
  background:var(--red);
  color:#fff;
}
.detail-actions .favorite{
  background:var(--glass);
  color:#fff;
}
.detail-actions .favorite.active{
  background:rgba(255,69,58,.2);
  color:var(--red);
}
.detail-cast{
  margin-top:16px;
}
.detail-cast .label{
  font-size:13px;
  font-weight:700;
  color:rgba(255,255,255,.4);
  margin-bottom:8px;
}
.detail-cast .cast-list{
  display:flex;
  gap:10px;
  overflow-x:auto;
}
.detail-cast .cast-item{
  text-align:center;
  flex-shrink:0;
}
.detail-cast .cast-item .avatar{
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--glass);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  background-size:cover;
  background-position:center;
}
.detail-cast .cast-item .name{
  font-size:10px;
  color:rgba(255,255,255,.5);
  margin-top:4px;
  max-width:60px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.toast{
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(30,30,34,.95);
  backdrop-filter:blur(20px);
  padding:10px 20px;
  border-radius:14px;
  font-size:13px;
  color:#fff;
  opacity:0;
  transition:all .3s;
  pointer-events:none;
  z-index:2000;
  border:1px solid var(--sep);
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:40px 0;
  color:rgba(255,255,255,.2);
}
.loading i{
  font-size:32px;
  display:block;
  margin-bottom:8px;
  animation:spin 1s linear infinite;
}
@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

@media (max-width:430px){
  .app-shell{
    max-height:100vh;
    border-radius:0;
  }
}
@media (max-width:380px){
  .movie-grid{
    gap:8px;
  }
  .movie-card .info .title{
    font-size:12px;
  }
  .detail-poster{
    font-size:48px;
  }
}
</style>
</head>
<body>
<div class="app-shell">

  <div class="app-header">
    <div class="title"><i class="bi bi-film"></i> Xem phim</div>
    <button class="action-btn" onclick="refreshMovies()"><i class="bi bi-arrow-clockwise"></i></button>
  </div>

  <div class="app-body">
    
    <div class="movie-search">
      <i class="bi bi-search"></i>
      <input id="movieSearch" type="text" placeholder="Tìm kiếm phim..." oninput="searchMovies()">
    </div>

    <div class="movie-categories">
      <button class="active" onclick="filterMovies('all', this)"><i class="bi bi-grid-fill"></i> Tất cả</button>
      <button onclick="filterMovies('action', this)"><i class="bi bi-lightning-fill"></i> Hành động</button>
      <button onclick="filterMovies('comedy', this)"><i class="bi bi-emoji-laughing-fill"></i> Hài</button>
      <button onclick="filterMovies('drama', this)"><i class="bi bi-heart-fill"></i> Tâm lý</button>
      <button onclick="filterMovies('science-fiction', this)"><i class="bi bi-rocket-fill"></i> Khoa học</button>
    </div>

    <div id="featuredContainer"></div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px;">
      <span style="font-size:17px;font-weight:800;">Phim nổi bật</span>
      <span style="font-size:12px;color:var(--red);font-weight:600;cursor:pointer;" onclick="showToast('🎬 Đang tải thêm phim...')">Xem tất cả →</span>
    </div>
    <div class="movie-grid" id="movieGrid">
      <div class="loading">
        <i class="bi bi-arrow-repeat"></i>
        Đang tải phim...
      </div>
    </div>
  </div>

  <div class="movie-detail" id="movieDetail">
    <div class="detail-header">
      <button class="back" onclick="closeDetail()"><i class="bi bi-chevron-left"></i> Quay lại</button>
      <span class="title" id="detailTitle">Tên phim</span>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// ================= TMDB CONFIG =================
const TMDB_API_KEY = 'YOUR_TMDB_API_KEY_HERE'; // Thay YOUR_TMDB_API_KEY_HERE bằng API key của bạn
const TMDB_BASE_URL = 'https://api.themoviedb.org/3';
const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';
const IMAGE_BASE_URL_ORIGINAL = 'https://image.tmdb.org/t/p/original';

// ================= STATE =================
let currentCategory = 'all';
let favoriteMovies = [];
let currentMovieId = null;
let allMovies = [];
let isLoading = false;

// ================= API FUNCTIONS =================
async function fetchMovies() {
  try {
    isLoading = true;
    showLoading();
    
    const [popularRes, topRatedRes, actionRes, comedyRes, dramaRes, sciFiRes] = await Promise.all([
      fetch(`${TMDB_BASE_URL}/movie/popular?api_key=${TMDB_API_KEY}&language=vi-VN&page=1`),
      fetch(`${TMDB_BASE_URL}/movie/top_rated?api_key=${TMDB_API_KEY}&language=vi-VN&page=1`),
      fetch(`${TMDB_BASE_URL}/discover/movie?api_key=${TMDB_API_KEY}&language=vi-VN&with_genres=28&page=1`),
      fetch(`${TMDB_BASE_URL}/discover/movie?api_key=${TMDB_API_KEY}&language=vi-VN&with_genres=35&page=1`),
      fetch(`${TMDB_BASE_URL}/discover/movie?api_key=${TMDB_API_KEY}&language=vi-VN&with_genres=18&page=1`),
      fetch(`${TMDB_BASE_URL}/discover/movie?api_key=${TMDB_API_KEY}&language=vi-VN&with_genres=878&page=1`)
    ]);

    const [popular, topRated, action, comedy, drama, sciFi] = await Promise.all([
      popularRes.json(),
      topRatedRes.json(),
      actionRes.json(),
      comedyRes.json(),
      dramaRes.json(),
      sciFiRes.json()
    ]);

    // Map movies với genre
    const mapMovies = (data, genre) => {
      return data.results.map(m => ({
        id: m.id,
        title: m.title,
        year: m.release_date ? parseInt(m.release_date.split('-')[0]) : 0,
        genre: genre,
        emoji: getEmojiForGenre(genre),
        rating: m.vote_average ? parseFloat(m.vote_average.toFixed(1)) : 0,
        reviews: m.vote_count || 0,
        plot: m.overview || 'Chưa có mô tả',
        cast: [],
        featured: false,
        backdrop: m.backdrop_path ? `${IMAGE_BASE_URL}${m.backdrop_path}` : null,
        poster: m.poster_path ? `${IMAGE_BASE_URL}${m.poster_path}` : null,
        release_date: m.release_date
      }));
    };

    const allMapped = [
      ...mapMovies(popular, 'all'),
      ...mapMovies(action, 'action'),
      ...mapMovies(comedy, 'comedy'),
      ...mapMovies(drama, 'drama'),
      ...mapMovies(sciFi, 'sci-fi')
    ];

    // Remove duplicates
    const uniqueMap = new Map();
    allMapped.forEach(m => {
      if (!uniqueMap.has(m.id) || m.genre === 'all') {
        uniqueMap.set(m.id, m);
      }
    });

    allMovies = Array.from(uniqueMap.values());

    // Set featured
    if (topRated.results && topRated.results.length > 0) {
      const featuredIndex = Math.floor(Math.random() * Math.min(5, topRated.results.length));
      const featuredMovie = allMovies.find(m => m.id === topRated.results[featuredIndex].id);
      if (featuredMovie) {
        featuredMovie.featured = true;
        // Lấy thông tin chi tiết cho featured
        await fetchMovieDetails(featuredMovie.id);
      }
    }

    renderMovies();
    isLoading = false;
  } catch (error) {
    console.error('Lỗi khi tải phim:', error);
    showToast('❌ Lỗi khi tải dữ liệu. Vui lòng thử lại!');
    isLoading = false;
    // Fallback to sample data
    useFallbackData();
  }
}

async function fetchMovieDetails(movieId) {
  try {
    const response = await fetch(`${TMDB_BASE_URL}/movie/${movieId}?api_key=${TMDB_API_KEY}&language=vi-VN&append_to_response=credits`);
    const data = await response.json();
    
    const movie = allMovies.find(m => m.id === movieId);
    if (movie) {
      movie.cast = data.credits?.cast?.slice(0, 5).map(actor => 
        `🎭 ${actor.name}`
      ) || [];
      movie.plot = data.overview || movie.plot;
      movie.runtime = data.runtime || 0;
      movie.genres = data.genres?.map(g => g.name) || [];
    }
    return data;
  } catch (error) {
    console.error('Lỗi khi lấy chi tiết phim:', error);
    return null;
  }
}

async function searchTMDB(query) {
  try {
    const response = await fetch(`${TMDB_BASE_URL}/search/movie?api_key=${TMDB_API_KEY}&language=vi-VN&query=${encodeURIComponent(query)}&page=1`);
    const data = await response.json();
    return data.results.map(m => ({
      id: m.id,
      title: m.title,
      year: m.release_date ? parseInt(m.release_date.split('-')[0]) : 0,
      genre: 'all',
      emoji: '🎬',
      rating: m.vote_average ? parseFloat(m.vote_average.toFixed(1)) : 0,
      reviews: m.vote_count || 0,
      plot: m.overview || 'Chưa có mô tả',
      cast: [],
      featured: false,
      backdrop: m.backdrop_path ? `${IMAGE_BASE_URL}${m.backdrop_path}` : null,
      poster: m.poster_path ? `${IMAGE_BASE_URL}${m.poster_path}` : null,
      release_date: m.release_date
    }));
  } catch (error) {
    console.error('Lỗi tìm kiếm:', error);
    return [];
  }
}

// ================= HELPER FUNCTIONS =================
function getEmojiForGenre(genre) {
  const emojis = {
    'all': '🎬',
    'action': '⚡',
    'comedy': '😄',
    'drama': '🎭',
    'sci-fi': '🚀'
  };
  return emojis[genre] || '🎬';
}

function getGenreId(genre) {
  const map = {
    'action': 28,
    'comedy': 35,
    'drama': 18,
    'sci-fi': 878
  };
  return map[genre] || null;
}

function formatNumber(num) {
  if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
  return num;
}

function getGenreName(genre) {
  const names = {
    'all': 'Tất cả',
    'action': 'Hành động',
    'comedy': 'Hài',
    'drama': 'Tâm lý',
    'sci-fi': 'Khoa học'
  };
  return names[genre] || genre;
}

function showLoading() {
  const grid = document.getElementById('movieGrid');
  grid.innerHTML = `
    <div class="loading">
      <i class="bi bi-arrow-repeat"></i>
      Đang tải phim...
    </div>
  `;
}

// ================= RENDER =================
async function renderMovies() {
  const grid = document.getElementById('movieGrid');
  const search = document.getElementById('movieSearch').value.toLowerCase().trim();
  
  let filtered = allMovies;
  
  // Filter by category
  if (currentCategory !== 'all') {
    filtered = filtered.filter(movie => movie.genre === currentCategory || movie.genre === 'all');
  }
  
  // Filter by search
  if (search) {
    const searchResults = await searchTMDB(search);
    if (searchResults.length > 0) {
      filtered = searchResults;
    } else {
      filtered = filtered.filter(movie => 
        movie.title.toLowerCase().includes(search)
      );
    }
  }
  
  // Render featured
  const featuredContainer = document.getElementById('featuredContainer');
  const featured = filtered.filter(m => m.featured);
  
  if (featured.length > 0 && !search) {
    const f = featured[0];
    const backdropStyle = f.backdrop ? `background-image: url(${f.backdrop});` : `background: ${f.backdrop || 'linear-gradient(135deg,#1a1a2e,#2a1a3a)'}`;
    featuredContainer.innerHTML = `
      <div class="movie-featured" onclick="openDetail(${f.id})">
        <div class="poster" style="${backdropStyle}">
          <div class="play-overlay">
            <i class="bi bi-play-fill"></i>
          </div>
        </div>
        <div class="info">
          <div class="title">${f.title}</div>
          <div class="meta">
            <span>${f.year || 'N/A'}</span>
            <span class="tag">${f.genre !== 'all' ? getGenreName(f.genre).toUpperCase() : 'NỔI BẬT'}</span>
            <span>⭐ ${f.rating}</span>
          </div>
          <div class="desc">${f.plot ? f.plot.slice(0, 80) + '...' : 'Chưa có mô tả'}</div>
        </div>
      </div>
    `;
  } else {
    featuredContainer.innerHTML = '';
  }
  
  if (filtered.length === 0) {
    grid.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:40px 0;color:rgba(255,255,255,.2);font-size:14px;">
        <i class="bi bi-film" style="font-size:32px;display:block;margin-bottom:8px;color:rgba(255,255,255,.05);"></i>
        Không tìm thấy phim nào
      </div>
    `;
    return;
  }
  
  grid.innerHTML = filtered.map(movie => {
    const posterStyle = movie.poster ? `background-image: url(${movie.poster});` : `background: ${movie.backdrop || 'linear-gradient(135deg,#1a1a2e,#2a1a3a)'}`;
    return `
    <div class="movie-card" onclick="openDetail(${movie.id})">
      <div class="poster" style="${posterStyle}">
        ${!movie.poster ? movie.emoji : ''}
        <span class="rating">⭐ ${movie.rating}</span>
      </div>
      <div class="info">
        <div class="title">${movie.title}</div>
        <div class="year">${movie.year || 'N/A'}</div>
        <div class="genres">
          <span>${movie.genre !== 'all' ? getGenreName(movie.genre) : 'Phổ biến'}</span>
        </div>
      </div>
    </div>
  `}).join('');
}

// ================= FILTER & SEARCH =================
function filterMovies(category, btn) {
  currentCategory = category;
  document.querySelectorAll('.movie-categories button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMovies();
}

function searchMovies() {
  renderMovies();
}

// ================= MOVIE DETAIL =================
async function openDetail(id) {
  currentMovieId = id;
  let movie = allMovies.find(m => m.id === id);
  
  if (!movie) {
    // Try to fetch from API
    const data = await fetchMovieDetails(id);
    if (data) {
      movie = {
        id: data.id,
        title: data.title,
        year: data.release_date ? parseInt(data.release_date.split('-')[0]) : 0,
        genre: 'all',
        emoji: '🎬',
        rating: data.vote_average ? parseFloat(data.vote_average.toFixed(1)) : 0,
        reviews: data.vote_count || 0,
        plot: data.overview || 'Chưa có mô tả',
        cast: data.credits?.cast?.slice(0, 5).map(actor => `🎭 ${actor.name}`) || [],
        featured: false,
        backdrop: data.backdrop_path ? `${IMAGE_BASE_URL}${data.backdrop_path}` : null,
        poster: data.poster_path ? `${IMAGE_BASE_URL}${data.poster_path}` : null,
        runtime: data.runtime || 0,
        genres: data.genres?.map(g => g.name) || []
      };
      allMovies.push(movie);
    }
  }
  
  if (!movie) {
    showToast('❌ Không tìm thấy thông tin phim');
    return;
  }
  
  const isFavorite = favoriteMovies.includes(id);
  
  document.getElementById('detailTitle').textContent = movie.title;
  document.getElementById('movieDetail').classList.add('open');
  
  const posterStyle = movie.backdrop ? `background-image: url(${movie.backdrop});` : `background: linear-gradient(135deg,#1a1a2e,#2a1a3a)`;
  const runtimeText = movie.runtime ? `${Math.floor(movie.runtime/60)}h ${movie.runtime%60}m` : 'Chưa rõ';
  const genreText = movie.genres?.length > 0 ? movie.genres.join(', ') : getGenreName(movie.genre);
  
  document.getElementById('detailBody').innerHTML = `
    <div class="detail-poster" style="${posterStyle}">
      ${!movie.backdrop ? movie.emoji : ''}
      <div class="play-btn" onclick="event.stopPropagation();showToast('🎬 Đang phát ${movie.title}...')">
        <i class="bi bi-play-fill"></i>
      </div>
    </div>
    
    <div class="detail-info">
      <div class="title">${movie.title}</div>
      <div class="meta">
        <span>${movie.year || 'N/A'}</span>
        <span class="dot">•</span>
        <span>${genreText}</span>
        <span class="dot">•</span>
        <span>⏱️ ${runtimeText}</span>
      </div>
      <div class="rating-row">
        <span class="stars">${'★'.repeat(Math.floor(movie.rating))}${movie.rating % 1 >= 0.5 ? '☆' : ''}</span>
        <span class="score">${movie.rating}</span>
        <span class="reviews">(${formatNumber(movie.reviews)} đánh giá)</span>
      </div>
      <div class="plot">${movie.plot || 'Chưa có mô tả'}</div>
      
      <div class="detail-actions">
        <button class="watch" onclick="showToast('🎬 Đang phát ${movie.title}...')">
          <i class="bi bi-play-fill"></i> Xem ngay
        </button>
        <button class="favorite ${isFavorite ? 'active' : ''}" onclick="toggleFavorite(${movie.id})">
          <i class="bi ${isFavorite ? 'bi-heart-fill' : 'bi-heart'}"></i>
        </button>
      </div>
    </div>
    
    ${movie.cast && movie.cast.length > 0 ? `
    <div class="detail-cast">
      <div class="label">🎭 Diễn viên</div>
      <div class="cast-list">
        ${movie.cast.map(c => `
          <div class="cast-item">
            <div class="avatar">${c.split(' ')[0]}</div>
            <div class="name">${c.replace('🎭 ', '')}</div>
          </div>
        `).join('')}
      </div>
    </div>
    ` : ''}
  `;
}

function closeDetail() {
  document.getElementById('movieDetail').classList.remove('open');
}

function toggleFavorite(id) {
  const index = favoriteMovies.indexOf(id);
  if (index === -1) {
    favoriteMovies.push(id);
    showToast('❤️ Đã thêm vào yêu thích');
  } else {
    favoriteMovies.splice(index, 1);
    showToast('💔 Đã xóa khỏi yêu thích');
  }
  if (currentMovieId === id) {
    openDetail(id);
  }
}

// ================= TOAST =================
function showToast(message) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ================= REFRESH =================
function refreshMovies() {
  if (!isLoading) {
    showToast('🔄 Đang cập nhật phim...');
    fetchMovies();
  }
}

// ================= KEYBOARD SHORTCUTS =================
document.addEventListener('keydown', function(e) {
  if (document.getElementById('movieDetail').classList.contains('open')) {
    if (e.key === 'Escape') {
      closeDetail();
    }
  }
  if (e.key === '/' && !e.ctrlKey && !e.metaKey) {
    const search = document.getElementById('movieSearch');
    if (document.activeElement !== search) {
      e.preventDefault();
      search.focus();
    }
  }
});
