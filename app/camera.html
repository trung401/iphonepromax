<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Camera</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0A84FF;
  --glass:rgba(255,255,255,.06);
}
*{margin:0;padding:0;box-sizing:border-box;}
::-webkit-scrollbar{display:none;}
html,body{
  height:100%;
  background:#000;
  font-family:'Inter',sans-serif;
  color:#fff;
  overflow:hidden;
}
.app-shell{
  max-width:430px;
  margin:0 auto;
  height:100vh;
  max-height:844px;
  background:#000;
  position:relative;
  border-radius:44px;
  overflow:hidden;
}

/* Camera view */
.camera-view{
  position:relative;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}
.camera-view video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .3s;
}
.camera-overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(to bottom, rgba(0,0,0,.4), transparent 20%, transparent 70%, rgba(0,0,0,.5));
}

/* Top controls */
.camera-top{
  position:absolute;
  top:12px;
  left:16px;
  right:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:10;
  pointer-events:none;
}
.camera-top button{
  pointer-events:auto;
  width:40px;
  height:40px;
  border:none;
  border-radius:50%;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(20px);
  color:white;
  font-size:18px;
  cursor:pointer;
  transition:all .2s;
  border:1px solid rgba(255,255,255,.06);
}
.camera-top button:active{
  transform:scale(.9);
}
.camera-top button.active{
  color:#FFD60A;
  background:rgba(255,214,10,.2);
}
.camera-mode{
  font-size:13px;
  font-weight:700;
  letter-spacing:1px;
  text-shadow:0 2px 10px rgba(0,0,0,.5);
  pointer-events:auto;
  background:rgba(0,0,0,.3);
  backdrop-filter:blur(10px);
  padding:6px 16px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.06);
}

/* Grid */
.camera-grid{
  position:absolute;
  inset:0;
  display:none;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  pointer-events:none;
  z-index:5;
}
.camera-grid.show{
  display:grid;
}
.camera-grid span{
  border-right:1px solid rgba(255,255,255,.15);
  border-bottom:1px solid rgba(255,255,255,.15);
}
.camera-grid span:nth-child(3n){border-right:none;}
.camera-grid span:nth-child(n+7){border-bottom:none;}

/* Zoom controls */
.camera-zoom{
  position:absolute;
  bottom:120px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  z-index:10;
  background:rgba(0,0,0,.4);
  backdrop-filter:blur(20px);
  padding:4px 6px;
  border-radius:30px;
  border:1px solid rgba(255,255,255,.06);
}
.camera-zoom button{
  width:36px;
  height:36px;
  border:none;
  border-radius:50%;
  background:transparent;
  color:rgba(255,255,255,.5);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
  font-family:inherit;
}
.camera-zoom button:active{
  transform:scale(.9);
}
.camera-zoom button.active{
  background:rgba(255,255,255,.2);
  color:#fff;
}

/* Bottom controls */
.camera-controls{
  position:absolute;
  bottom:20px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:10;
  padding:0 20px;
}
.shutter{
  width:72px;
  height:72px;
  border-radius:50%;
  border:3px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  background:transparent;
  transition:all .2s;
  position:relative;
}
.shutter:active{
  transform:scale(.9);
}
.shutter .inner{
  width:60px;
  height:60px;
  border-radius:50%;
  background:#fff;
  transition:all .2s;
}
.shutter:active .inner{
  transform:scale(.85);
}
.shutter .ring{
  position:absolute;
  inset:-4px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.15);
  animation:spin 10s linear infinite;
}
@keyframes spin{
  0%{transform:rotate(0);}
  100%{transform:rotate(360deg);}
}

.camera-side{
  width:48px;
  height:48px;
  border-radius:50%;
  border:none;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(20px);
  color:white;
  font-size:20px;
  cursor:pointer;
  transition:all .2s;
  border:1px solid rgba(255,255,255,.06);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.camera-side:active{
  transform:scale(.9);
}
.camera-side .thumb{
  width:100%;
  height:100%;
  object-fit:cover;
}
.camera-side .placeholder{
  font-size:20px;
  color:rgba(255,255,255,.3);
}

/* Flash effect */
.camera-flash{
  position:fixed;
  inset:0;
  background:white;
  z-index:9999;
  pointer-events:none;
  opacity:0;
}
.camera-flash.flash{
  animation:cameraFlashAnim .25s ease;
}
@keyframes cameraFlashAnim{
  0%{opacity:.8;}
  100%{opacity:0;}
}

/* Shutter sound animation */
.shutter-anim{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.3);
  z-index:50;
  pointer-events:none;
  opacity:0;
}
.shutter-anim.active{
  animation:shutterAnim .15s ease;
}
@keyframes shutterAnim{
  0%{opacity:.5;}
  100%{opacity:0;}
}

/* Preview modal */
.preview-modal{
  position:absolute;
  inset:0;
  background:#000;
  z-index:100;
  display:none;
  flex-direction:column;
  animation:slideUp .35s ease;
}
@keyframes slideUp{
  0%{transform:translateY(20px);opacity:0;}
  100%{transform:translateY(0);opacity:1;}
}
.preview-modal.open{
  display:flex;
}
.preview-header{
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(20px);
  flex-shrink:0;
}
.preview-header button{
  border:none;
  background:transparent;
  color:#fff;
  font-size:18px;
  cursor:pointer;
  padding:4px 8px;
}
.preview-header .title{
  font-size:16px;
  font-weight:600;
}
.preview-body{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#000;
}
.preview-body img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  border-radius:12px;
}
.preview-actions{
  padding:16px 20px 30px;
  display:flex;
  gap:12px;
  justify-content:center;
  border-top:1px solid rgba(255,255,255,.06);
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(20px);
}
.preview-actions button{
  flex:1;
  padding:12px;
  border-radius:14px;
  border:none;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
  font-family:inherit;
}
.preview-actions button:active{
  transform:scale(.95);
}
.preview-actions .save{
  background:var(--blue);
  color:#fff;
}
.preview-actions .close{
  background:rgba(255,255,255,.06);
  color:#fff;
}

/* Toast */
.toast{
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(30,30,34,.95);
  backdrop-filter:blur(20px);
  padding:10px 20px;
  border-radius:14px;
  font-size:13px;
  color:#fff;
  opacity:0;
  transition:all .3s;
  pointer-events:none;
  z-index:200;
  border:1px solid rgba(255,255,255,.06);
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* Responsive */
@media (max-width:430px){
  .app-shell{
    max-height:100vh;
    border-radius:0;
  }
}
@media (max-width:380px){
  .shutter{
    width:60px;
    height:60px;
  }
  .shutter .inner{
    width:50px;
    height:50px;
  }
  .camera-side{
    width:40px;
    height:40px;
    font-size:16px;
  }
  .camera-zoom button{
    width:30px;
    height:30px;
    font-size:10px;
  }
}
</style>
</head>
<body>
<div class="app-shell">

  <!-- CAMERA -->
  <div class="camera-view">
    <video id="cameraVideo" autoplay playsinline muted></video>
    <div class="camera-overlay"></div>
    
    <!-- Top controls -->
    <div class="camera-top">
      <button onclick="toggleFlash()" id="flashBtn"><i class="bi bi-lightning-fill"></i></button>
      <div class="camera-mode">📷 ẢNH</div>
      <button onclick="toggleGrid()" id="gridBtn"><i class="bi bi-grid-3x3"></i></button>
    </div>

    <!-- Grid -->
    <div id="cameraGrid" class="camera-grid">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>

    <!-- Zoom -->
    <div class="camera-zoom">
      <button class="active" onclick="setZoom(1,this)">1x</button>
      <button onclick="setZoom(2,this)">2x</button>
      <button onclick="setZoom(3,this)">3x</button>
      <button onclick="setZoom(5,this)">5x</button>
    </div>

    <!-- Controls -->
    <div class="camera-controls">
      <button class="camera-side" id="galleryThumb" onclick="openGallery()">
        <span class="placeholder" id="galleryPlaceholder"><i class="bi bi-images"></i></span>
        <img id="galleryImg" class="thumb" style="display:none;" alt="thumbnail">
      </button>
      
      <button class="shutter" onclick="takePhoto()">
        <div class="inner"></div>
        <div class="ring"></div>
      </button>
      
      <button class="camera-side" onclick="switchCamera()">
        <i class="bi bi-arrow-repeat"></i>
      </button>
    </div>
  </div>

  <!-- Flash -->
  <div id="cameraFlash" class="camera-flash"></div>

  <!-- Shutter animation -->
  <div id="shutterAnim" class="shutter-anim"></div>

  <!-- Preview Modal -->
  <div class="preview-modal" id="previewModal">
    <div class="preview-header">
      <button onclick="closePreview()"><i class="bi bi-x-lg"></i></button>
      <span class="title">Ảnh vừa chụp</span>
      <button onclick="closePreview()" style="color:rgba(255,255,255,.3);">Đóng</button>
    </div>
    <div class="preview-body">
      <img id="previewImage" src="" alt="Preview">
    </div>
    <div class="preview-actions">
      <button class="close" onclick="closePreview()">Đóng</button>
      <button class="save" onclick="savePhoto()"><i class="bi bi-download"></i> Lưu ảnh</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>
</div>

<script>
// ================= STATE =================
let cameraStream = null;
let facingMode = 'environment';
let lastPhoto = null;
let isFlashOn = false;
let currentZoom = 1;

// ================= CAMERA =================
async function startCamera() {
  try {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
    }
    const constraints = {
      video: {
        facingMode: facingMode,
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      audio: false
    };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    cameraStream = stream;
    const video = document.getElementById('cameraVideo');
    video.srcObject = stream;
    await video.play();
  } catch (err) {
    showToast('⚠️ Không thể mở camera: ' + err.message);
    console.error('Camera error:', err);
  }
}

function switchCamera() {
  facingMode = (facingMode === 'environment') ? 'user' : 'environment';
  startCamera();
  showToast('🔄 Đã chuyển camera');
}

// ================= ZOOM =================
function setZoom(level, btn) {
  currentZoom = level;
  document.querySelectorAll('.camera-zoom button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const video = document.getElementById('cameraVideo');
  video.style.transform = `scale(${level})`;
  showToast(`🔍 Zoom ${level}x`);
}

// ================= TAKE PHOTO =================
function takePhoto() {
  const video = document.getElementById('cameraVideo');
  if (!video.srcObject) {
    showToast('⚠️ Camera chưa sẵn sàng');
    return;
  }

  // Flash effect
  if (isFlashOn) {
    const flash = document.getElementById('cameraFlash');
    flash.classList.remove('flash');
    void flash.offsetWidth;
    flash.classList.add('flash');
  }

  // Shutter animation
  const anim = document.getElementById('shutterAnim');
  anim.classList.remove('active');
  void anim.offsetWidth;
  anim.classList.add('active');

  // Capture photo
  const canvas = document.createElement('canvas');
  const w = video.videoWidth || 640;
  const h = video.videoHeight || 480;
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  
  // Apply zoom effect
  if (currentZoom > 1) {
    const zoomW = w / currentZoom;
    const zoomH = h / currentZoom;
    const sx = (w - zoomW) / 2;
    const sy = (h - zoomH) / 2;
    ctx.drawImage(video, sx, sy, zoomW, zoomH, 0, 0, w, h);
  } else {
    ctx.drawImage(video, 0, 0, w, h);
  }
  
  lastPhoto = canvas.toDataURL('image/jpeg', 0.95);
  
  // Update thumbnail
  const thumbImg = document.getElementById('galleryImg');
  const placeholder = document.getElementById('galleryPlaceholder');
  thumbImg.src = lastPhoto;
  thumbImg.style.display = 'block';
  placeholder.style.display = 'none';
  
  // Show preview
  document.getElementById('previewImage').src = lastPhoto;
  document.getElementById('previewModal').classList.add('open');
  
  // Vibrate if supported
  if (navigator.vibrate) navigator.vibrate(50);
  
  showToast('📸 Đã chụp ảnh!');
}

// ================= SAVE PHOTO =================
function savePhoto() {
  if (!lastPhoto) {
    showToast('⚠️ Không có ảnh để lưu');
    return;
  }
  
  const link = document.createElement('a');
  link.download = `photo_${Date.now()}.jpg`;
  link.href = lastPhoto;
  link.click();
  showToast('✅ Đã lưu ảnh');
  setTimeout(closePreview, 500);
}

function closePreview() {
  document.getElementById('previewModal').classList.remove('open');
}

// ================= GALLERY =================
function openGallery() {
  if (lastPhoto) {
    document.getElementById('previewImage').src = lastPhoto;
    document.getElementById('previewModal').classList.add('open');
  } else {
    showToast('📷 Chưa có ảnh nào');
  }
}

// ================= TOGGLE =================
function toggleFlash() {
  isFlashOn = !isFlashOn;
  document.getElementById('flashBtn').classList.toggle('active');
  showToast(isFlashOn ? '⚡ Đèn flash bật' : '⚡ Đèn flash tắt');
}

function toggleGrid() {
  document.getElementById('cameraGrid').classList.toggle('show');
  document.getElementById('gridBtn').classList.toggle('active');
  showToast(document.getElementById('cameraGrid').classList.contains('show') ? '📐 Bật lưới' : '📐 Tắt lưới');
}

// ================= TOAST =================
function showToast(message) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ================= KEYBOARD SHORTCUTS =================
document.addEventListener('keydown', function(e) {
  if (e.key === ' ' || e.key === 'Space') {
    e.preventDefault();
    takePhoto();
  }
  if (e.key === 'Escape') {
    closePreview();
  }
  if (e.key === 'g' || e.key === 'G') {
    toggleGrid();
  }
  if (e.key === 'f' || e.key === 'F') {
    toggleFlash();
  }
});

// ================= INIT =================
startCamera();

// Auto focus on load
setTimeout(() => {
  const video = document.getElementById('cameraVideo');
  if (video) {
    video.style.transform = 'scale(1)';
  }
}, 1000);
</script>
</body>
</html>
