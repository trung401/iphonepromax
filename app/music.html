<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nhạc</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0A84FF;
  --sep:rgba(255,255,255,.08);
  --glass:rgba(255,255,255,.06);
}
*{margin:0;padding:0;box-sizing:border-box;}
::-webkit-scrollbar{display:none;}
body{
  background:#000;
  font-family:'Inter',sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.app-shell{
  width:100%;
  max-width:430px;
  height:100vh;
  max-height:844px;
  background:#000;
  display:flex;
  flex-direction:column;
  border-radius:44px;
  overflow:hidden;
  position:relative;
}

/* Header */
.app-header{
  padding:16px 20px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--sep);
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(20px);
  flex-shrink:0;
}
.app-header .title{
  font-size:22px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:8px;
}
.app-header .title i{
  color:#FF375F;
}
.app-header .action-btn{
  border:none;
  background:rgba(255,255,255,.06);
  color:#fff;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
  transition:all .2s;
  display:flex;
  align-items:center;
  justify-content:center;
}
.app-header .action-btn:active{
  transform:scale(.9);
  background:rgba(255,255,255,.12);
}

/* Playlist */
.playlist{
  flex:1;
  overflow-y:auto;
  padding:12px 16px 8px;
}
.playlist-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  border-radius:12px;
  cursor:pointer;
  transition:all .2s;
  position:relative;
}
.playlist-item:active{
  background:var(--glass);
}
.playlist-item.active{
  background:rgba(255,55,95,.12);
}
.playlist-item.active .song-number{
  color:#FF375F;
}
.playlist-item.active .song-title{
  color:#fff;
}
.song-number{
  width:24px;
  font-size:13px;
  font-weight:600;
  color:rgba(255,255,255,.2);
  text-align:center;
  flex-shrink:0;
}
.song-info{
  flex:1;
  min-width:0;
}
.song-title{
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.song-artist{
  font-size:12px;
  color:rgba(255,255,255,.35);
  margin-top:1px;
}
.song-duration{
  font-size:12px;
  color:rgba(255,255,255,.25);
  flex-shrink:0;
}
.song-playing-indicator{
  width:20px;
  height:20px;
  display:none;
  align-items:center;
  justify-content:center;
}
.song-playing-indicator.show{
  display:flex;
}
.song-playing-indicator i{
  color:#FF375F;
  font-size:16px;
  animation:pulse 1s infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;}
  50%{opacity:.3;}
}

/* Now playing bar */
.now-playing-bar{
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--sep);
  padding:10px 16px 8px;
  flex-shrink:0;
  cursor:pointer;
  transition:background .2s;
}
.now-playing-bar:active{
  background:rgba(255,255,255,.08);
}
.now-playing-bar .mini-info{
  display:flex;
  align-items:center;
  gap:12px;
}
.now-playing-bar .mini-art{
  width:44px;
  height:44px;
  border-radius:10px;
  background:linear-gradient(160deg,#FF5C7A,#D6003D);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  flex-shrink:0;
}
.now-playing-bar .mini-details{
  flex:1;
  min-width:0;
}
.now-playing-bar .mini-title{
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.now-playing-bar .mini-artist{
  font-size:12px;
  color:rgba(255,255,255,.35);
}
.now-playing-bar .mini-controls{
  display:flex;
  gap:16px;
  font-size:20px;
  color:rgba(255,255,255,.6);
}
.now-playing-bar .mini-controls i{
  cursor:pointer;
  transition:all .2s;
}
.now-playing-bar .mini-controls i:active{
  transform:scale(.85);
  color:#fff;
}
.now-playing-bar .mini-progress{
  width:100%;
  height:2px;
  background:rgba(255,255,255,.08);
  border-radius:2px;
  margin-top:8px;
  position:relative;
  overflow:hidden;
}
.now-playing-bar .mini-progress .fill{
  height:100%;
  background:linear-gradient(90deg,#FF375F,#FF6B8A);
  border-radius:2px;
  width:0%;
  transition:width .1s;
}

/* Player full */
.player-full{
  position:absolute;
  inset:0;
  background:#000;
  z-index:100;
  display:none;
  flex-direction:column;
  animation:slideUp .4s ease;
  border-radius:44px;
}
@keyframes slideUp{
  0%{transform:translateY(30px);opacity:0;}
  100%{transform:translateY(0);opacity:1;}
}
.player-full.open{
  display:flex;
}
.player-header{
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--sep);
  flex-shrink:0;
}
.player-header .close{
  border:none;
  background:transparent;
  color:rgba(255,255,255,.5);
  font-size:20px;
  cursor:pointer;
}
.player-header .title{
  font-size:16px;
  font-weight:600;
}
.player-body{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  text-align:center;
}
.player-art{
  width:200px;
  height:200px;
  border-radius:20px;
  background:linear-gradient(160deg,#FF5C7A,#D6003D);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
  box-shadow:0 20px 60px rgba(214,0,61,.3);
}
.player-title{
  font-size:22px;
  font-weight:700;
  margin-top:20px;
}
.player-artist{
  font-size:16px;
  color:rgba(255,255,255,.5);
  margin-top:4px;
}
.player-progress{
  width:100%;
  margin-top:24px;
}
.player-progress input[type=range]{
  width:100%;
  height:4px;
  -webkit-appearance:none;
  appearance:none;
  background:rgba(255,255,255,.1);
  border-radius:4px;
  outline:none;
}
.player-progress input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#FF375F;
  cursor:pointer;
  box-shadow:0 0 20px rgba(255,55,95,.4);
}
.player-progress input[type=range]::-moz-range-thumb{
  width:16px;
  height:16px;
  border-radius:50%;
  background:#FF375F;
  cursor:pointer;
  border:none;
}
.player-time{
  width:100%;
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:rgba(255,255,255,.35);
  margin-top:6px;
}
.player-controls{
  display:flex;
  gap:32px;
  font-size:28px;
  align-items:center;
  margin-top:20px;
}
.player-controls i{
  cursor:pointer;
  transition:all .2s;
  color:rgba(255,255,255,.8);
}
.player-controls i:active{
  transform:scale(.85);
}
.player-controls .play-btn{
  font-size:48px;
  color:#FF375F;
}
.player-controls .play-btn:active{
  transform:scale(.9);
}

/* Responsive */
@media (max-width:430px){
  .app-shell{
    max-height:100vh;
    border-radius:0;
  }
  .player-full{
    border-radius:0;
  }
}
@media (max-width:380px){
  .player-art{
    width:160px;
    height:160px;
    font-size:56px;
  }
  .player-title{
    font-size:18px;
  }
}
</style>
</head>
<body>
<div class="app-shell">

  <!-- HEADER -->
  <div class="app-header">
    <div class="title"><i class="bi bi-music-note-beamed"></i> Nhạc</div>
    <button class="action-btn" onclick="shuffleSongs()"><i class="bi bi-shuffle"></i></button>
  </div>

  <!-- PLAYLIST -->
  <div class="playlist" id="playlist">
    <!-- Songs will be rendered by JS -->
  </div>

  <!-- NOW PLAYING BAR -->
  <div class="now-playing-bar" onclick="openPlayer()">
    <div class="mini-info">
      <div class="mini-art" id="miniArt">🎵</div>
      <div class="mini-details">
        <div class="mini-title" id="miniTitle">Chọn bài hát</div>
        <div class="mini-artist" id="miniArtist">Chưa phát</div>
      </div>
      <div class="mini-controls">
        <i class="bi bi-skip-backward-fill" onclick="event.stopPropagation();prevSong()"></i>
        <i id="miniPlayBtn" class="bi bi-play-circle-fill" onclick="event.stopPropagation();togglePlay()"></i>
        <i class="bi bi-skip-forward-fill" onclick="event.stopPropagation();nextSong()"></i>
      </div>
    </div>
    <div class="mini-progress"><div class="fill" id="miniProgressFill"></div></div>
  </div>

  <!-- FULL PLAYER -->
  <div class="player-full" id="playerFull">
    <div class="player-header">
      <button class="close" onclick="closePlayer()"><i class="bi bi-chevron-down"></i></button>
      <span class="title">Đang phát</span>
      <span style="width:24px;"></span>
    </div>
    <div class="player-body">
      <div class="player-art" id="playerArt">🎵</div>
      <div class="player-title" id="playerTitle">Bài hát mẫu</div>
      <div class="player-artist" id="playerArtist">Demo</div>
      <div class="player-progress">
        <input type="range" id="playerProgress" min="0" max="100" value="0">
        <div class="player-time">
          <span id="playerCurrentTime">0:00</span>
          <span id="playerDuration">0:00</span>
        </div>
      </div>
      <div class="player-controls">
        <i class="bi bi-skip-backward-fill" onclick="prevSong()"></i>
        <i id="playerPlayBtn" class="bi bi-play-circle-fill play-btn" onclick="togglePlay()"></i>
        <i class="bi bi-skip-forward-fill" onclick="nextSong()"></i>
      </div>
    </div>
  </div>

  <!-- AUDIO ELEMENT -->
  <audio id="audioPlayer"></audio>
</div>

<script>
// ================= SONG DATA =================
const songs = [
  {
    id: 1,
    title: 'Blinding Lights',
    artist: 'The Weeknd',
    duration: '3:20',
    color: 'linear-gradient(160deg,#FF5C7A,#D6003D)',
    emoji: '🌃'
  },
  {
    id: 2,
    title: 'Dance Monkey',
    artist: 'Tones and I',
    duration: '3:29',
    color: 'linear-gradient(160deg,#FFD60A,#FF9500)',
    emoji: '🐒'
  },
  {
    id: 3,
    title: 'Shape of You',
    artist: 'Ed Sheeran',
    duration: '3:53',
    color: 'linear-gradient(160deg,#30D158,#00A84D)',
    emoji: '🎸'
  },
  {
    id: 4,
    title: 'Levitating',
    artist: 'Dua Lipa',
    duration: '3:23',
    color: 'linear-gradient(160deg,#BF5AF2,#8A3AC0)',
    emoji: '✨'
  },
  {
    id: 5,
    title: 'Starboy',
    artist: 'The Weeknd',
    duration: '4:16',
    color: 'linear-gradient(160deg,#0A84FF,#0057D8)',
    emoji: '⭐'
  },
  {
    id: 6,
    title: 'Believer',
    artist: 'Imagine Dragons',
    duration: '3:24',
    color: 'linear-gradient(160deg,#FF453A,#CC0000)',
    emoji: '🔥'
  },
  {
    id: 7,
    title: 'Havana',
    artist: 'Camila Cabello',
    duration: '3:37',
    color: 'linear-gradient(160deg,#FF9F0A,#D68A0A)',
    emoji: '🌴'
  },
  {
    id: 8,
    title: 'Bad Guy',
    artist: 'Billie Eilish',
    duration: '3:14',
    color: 'linear-gradient(160deg,#64D2FF,#0088CC)',
    emoji: '😈'
  }
];

// ================= STATE =================
let currentSongIndex = 0;
let isPlaying = false;
let isShuffle = false;
let audio = document.getElementById('audioPlayer');
let currentSong = null;

// ================= RENDER PLAYLIST =================
function renderPlaylist() {
  const container = document.getElementById('playlist');
  container.innerHTML = songs.map((song, index) => `
    <div class="playlist-item ${index === currentSongIndex ? 'active' : ''}" onclick="playSong(${index})">
      <div class="song-number">${index + 1}</div>
      <div class="song-info">
        <div class="song-title">${song.emoji} ${song.title}</div>
        <div class="song-artist">${song.artist}</div>
      </div>
      <div class="song-duration">${song.duration}</div>
      <div class="song-playing-indicator ${index === currentSongIndex && isPlaying ? 'show' : ''}">
        <i class="bi bi-volume-up-fill"></i>
      </div>
    </div>
  `).join('');
}

// ================= PLAY SONG =================
function playSong(index) {
  if (index < 0 || index >= songs.length) return;
  
  currentSongIndex = index;
  currentSong = songs[index];
  
  // Update UI
  updateNowPlaying();
  updatePlayer();
  renderPlaylist();
  
  // In real scenario, you would load actual audio file here
  // For demo, we'll simulate playback
  if (isPlaying) {
    // If already playing, just update display
  } else {
    togglePlay();
  }
}

function togglePlay() {
  if (!currentSong) {
    playSong(0);
    return;
  }
  
  isPlaying = !isPlaying;
  
  if (isPlaying) {
    // Simulate playback
    updatePlayButtons();
    // In real app: audio.play()
    simulateProgress();
  } else {
    // In real app: audio.pause()
    clearInterval(window.progressInterval);
    updatePlayButtons();
  }
}

function simulateProgress() {
  let progress = 0;
  clearInterval(window.progressInterval);
  window.progressInterval = setInterval(() => {
    if (!isPlaying) {
      clearInterval(window.progressInterval);
      return;
    }
    progress += 0.5;
    if (progress >= 100) {
      clearInterval(window.progressInterval);
      isPlaying = false;
      updatePlayButtons();
      document.getElementById('miniProgressFill').style.width = '0%';
      document.getElementById('playerProgress').value = 0;
      return;
    }
    document.getElementById('miniProgressFill').style.width = progress + '%';
    document.getElementById('playerProgress').value = progress;
    
    // Update time
    const duration = currentSong.duration.split(':');
    const totalSec = parseInt(duration[0]) * 60 + parseInt(duration[1]);
    const currentSec = (progress / 100) * totalSec;
    const min = Math.floor(currentSec / 60);
    const sec = Math.floor(currentSec % 60);
    document.getElementById('playerCurrentTime').textContent = `${min}:${sec < 10 ? '0' : ''}${sec}`;
  }, 100);
}

function updatePlayButtons() {
  const playIcon = isPlaying ? 'bi-pause-circle-fill' : 'bi-play-circle-fill';
  document.getElementById('miniPlayBtn').className = `bi ${playIcon}`;
  document.getElementById('playerPlayBtn').className = `bi ${playIcon} play-btn`;
  renderPlaylist();
}

function updateNowPlaying() {
  if (!currentSong) return;
  document.getElementById('miniArt').textContent = currentSong.emoji;
  document.getElementById('miniTitle').textContent = currentSong.title;
  document.getElementById('miniArtist').textContent = currentSong.artist;
}

function updatePlayer() {
  if (!currentSong) return;
  document.getElementById('playerArt').textContent = currentSong.emoji;
  document.getElementById('playerArt').style.background = currentSong.color;
  document.getElementById('playerTitle').textContent = currentSong.title;
  document.getElementById('playerArtist').textContent = currentSong.artist;
  document.getElementById('playerDuration').textContent = currentSong.duration;
  document.getElementById('playerCurrentTime').textContent = '0:00';
}

// ================= CONTROLS =================
function nextSong() {
  let nextIndex = currentSongIndex + 1;
  if (isShuffle) {
    nextIndex = Math.floor(Math.random() * songs.length);
  } else if (nextIndex >= songs.length) {
    nextIndex = 0;
  }
  playSong(nextIndex);
  if (!isPlaying) togglePlay();
}

function prevSong() {
  let prevIndex = currentSongIndex - 1;
  if (prevIndex < 0) prevIndex = songs.length - 1;
  playSong(prevIndex);
  if (!isPlaying) togglePlay();
}

function shuffleSongs() {
  isShuffle = !isShuffle;
  document.querySelector('.action-btn').style.color = isShuffle ? '#FF375F' : '#fff';
  document.querySelector('.action-btn').style.background = isShuffle ? 'rgba(255,55,95,.15)' : 'rgba(255,255,255,.06)';
}

// ================= PLAYER UI =================
function openPlayer() {
  if (!currentSong) {
    playSong(0);
  }
  document.getElementById('playerFull').classList.add('open');
}

function closePlayer() {
  document.getElementById('playerFull').classList.remove('open');
}

// ================= PROGRESS CONTROL =================
document.getElementById('playerProgress').addEventListener('input', function() {
  if (!currentSong) return;
  document.getElementById('miniProgressFill').style.width = this.value + '%';
  
  const duration = currentSong.duration.split(':');
  const totalSec = parseInt(duration[0]) * 60 + parseInt(duration[1]);
  const currentSec = (this.value / 100) * totalSec;
  const min = Math.floor(currentSec / 60);
  const sec = Math.floor(currentSec % 60);
  document.getElementById('playerCurrentTime').textContent = `${min}:${sec < 10 ? '0' : ''}${sec}`;
});

// ================= KEYBOARD SHORTCUTS =================
document.addEventListener('keydown', function(e) {
  if (e.key === ' ' || e.key === 'Space') {
    e.preventDefault();
    togglePlay();
  }
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    nextSong();
  }
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    prevSong();
  }
  if (e.key === 'Escape') {
    closePlayer();
  }
});

// ================= AUDIO EVENTS =================
audio.addEventListener('ended', function() {
  isPlaying = false;
  updatePlayButtons();
  document.getElementById('miniProgressFill').style.width = '0%';
  document.getElementById('playerProgress').value = 0;
  nextSong();
});

// ================= INIT =================
function init() {
  // Load first song
  currentSong = songs[0];
  updateNowPlaying();
  updatePlayer();
  renderPlaylist();
  
  // Set mini progress fill initial
  document.getElementById('miniProgressFill').style.width = '0%';
}

init();

// Handle visibility change to pause when hidden
document.addEventListener('visibilitychange', function() {
  if (document.hidden && isPlaying) {
    // Pause when app is hidden (optional)
  }
});
</script>
</body>
</html>
