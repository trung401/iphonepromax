<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tin nhắn</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0A84FF;
  --green:#30D158;
  --pink:#FF375F;
  --orange:#FF9F0A;
  --purple:#BF5AF2;
  --sep:rgba(255,255,255,.06);
  --glass:rgba(255,255,255,.04);
  --glass-strong:rgba(255,255,255,.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
::-webkit-scrollbar{display:none;}
html,body{height:100%;}
body{
  background:#000;
  font-family:'Inter',sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
}
.app-shell{
  max-width:430px;
  width:100%;
  height:100vh;
  max-height:844px;
  background:#000;
  display:flex;
  flex-direction:column;
  border-radius:44px;
  overflow:hidden;
  position:relative;
}

/* Header */
.app-header{
  padding:16px 20px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--sep);
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(20px);
  flex-shrink:0;
}
.app-header .title{
  font-size:22px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:8px;
}
.app-header .title i{
  color:var(--green);
}
.app-header .action-btn{
  border:none;
  background:rgba(255,255,255,.06);
  color:var(--blue);
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
  transition:all .2s;
  display:flex;
  align-items:center;
  justify-content:center;
}
.app-header .action-btn:active{
  transform:scale(.9);
  background:rgba(255,255,255,.12);
}

.app-body{
  flex:1;
  padding:12px 16px 16px;
  overflow-y:auto;
  background:#000;
}

/* Search */
.messages-search{
  height:40px;
  background:var(--glass);
  border-radius:12px;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:10px;
  margin-bottom:16px;
  border:1px solid transparent;
  transition:all .3s;
}
.messages-search:focus-within{
  border-color:rgba(10,132,255,.3);
  background:rgba(255,255,255,.04);
}
.messages-search i{
  color:rgba(255,255,255,.2);
  font-size:16px;
}
.messages-search input{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  color:white;
  font-size:14px;
  font-family:inherit;
}
.messages-search input::placeholder{
  color:rgba(255,255,255,.2);
}

/* Conversation */
.conversation{
  display:flex;
  gap:12px;
  align-items:center;
  padding:12px 10px;
  border-radius:14px;
  cursor:pointer;
  transition:all .2s;
  position:relative;
}
.conversation:active{
  background:var(--glass-strong);
  transform:scale(.98);
}
.conversation.unread{
  background:rgba(10,132,255,.04);
}
.conversation .unread-badge{
  position:absolute;
  top:8px;
  right:8px;
  background:var(--blue);
  color:#fff;
  font-size:10px;
  font-weight:700;
  min-width:18px;
  height:18px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 6px;
}

.message-avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:700;
  color:white;
  flex-shrink:0;
  position:relative;
}
.message-avatar .online-dot{
  position:absolute;
  bottom:2px;
  right:2px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--green);
  border:2px solid #000;
}
.message-avatar.blue{background:linear-gradient(135deg,#0A84FF,#0057D8);}
.message-avatar.green{background:linear-gradient(135deg,#30D158,#00A84D);}
.message-avatar.pink{background:linear-gradient(135deg,#FF375F,#D6003D);}
.message-avatar.orange{background:linear-gradient(135deg,#FF9F0A,#D68A0A);}
.message-avatar.purple{background:linear-gradient(135deg,#BF5AF2,#8A3AC0);}

.conversation-info{
  flex:1;
  min-width:0;
}
.conversation-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.conversation-top strong{
  font-size:15px;
  font-weight:600;
}
.conversation-top .time{
  font-size:11px;
  color:rgba(255,255,255,.25);
  flex-shrink:0;
}
.conversation-bottom{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:2px;
}
.conversation-bottom .sender{
  font-size:12px;
  font-weight:600;
  color:var(--blue);
}
.conversation-bottom .message-preview{
  font-size:13px;
  color:rgba(255,255,255,.4);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.conversation-bottom .pinned{
  color:var(--orange);
  font-size:12px;
}

/* Chat screen */
.messages-chat{
  position:absolute;
  inset:0;
  background:#000;
  display:none;
  flex-direction:column;
  z-index:20;
  animation:slideIn .35s ease;
}
@keyframes slideIn{
  0%{transform:translateX(30px);opacity:0;}
  100%{transform:translateX(0);opacity:1;}
}
.messages-chat.open{
  display:flex;
}

.chat-header{
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--sep);
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(20px);
  flex-shrink:0;
}
.chat-back{
  border:none;
  background:transparent;
  color:var(--blue);
  font-size:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:4px;
  padding:4px 8px;
  border-radius:8px;
  font-weight:500;
  font-family:inherit;
}
.chat-back:active{
  background:rgba(10,132,255,.1);
}
.chat-contact{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
}
.chat-contact .message-avatar{
  width:36px;
  height:36px;
  font-size:14px;
}
.chat-contact .info{
  display:flex;
  flex-direction:column;
}
.chat-contact .name{
  font-size:15px;
  font-weight:700;
}
.chat-contact .status{
  font-size:11px;
  color:rgba(255,255,255,.3);
}
.chat-actions{
  display:flex;
  gap:6px;
}
.chat-actions button{
  border:none;
  background:transparent;
  color:rgba(255,255,255,.3);
  font-size:18px;
  cursor:pointer;
  padding:4px;
}
.chat-actions button:active{
  transform:scale(.9);
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:16px 14px;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:#000;
}
.chat-messages .date-divider{
  text-align:center;
  font-size:11px;
  color:rgba(255,255,255,.15);
  padding:8px 0;
  position:relative;
}
.chat-messages .date-divider::before{
  content:'';
  position:absolute;
  left:20%;
  right:20%;
  top:50%;
  height:1px;
  background:var(--sep);
}
.chat-messages .date-divider span{
  background:#000;
  padding:0 12px;
  position:relative;
  z-index:1;
}

.chat-bubble{
  max-width:80%;
  padding:10px 14px;
  border-radius:18px;
  font-size:14px;
  line-height:1.5;
  word-break:break-word;
  position:relative;
}
.chat-bubble.received{
  align-self:flex-start;
  background:var(--glass-strong);
  color:rgba(255,255,255,.9);
  border-bottom-left-radius:4px;
}
.chat-bubble.sent{
  align-self:flex-end;
  background:var(--blue);
  color:white;
  border-bottom-right-radius:4px;
}
.chat-bubble .time{
  font-size:10px;
  color:rgba(255,255,255,.3);
  margin-top:4px;
  display:block;
  text-align:right;
}
.chat-bubble.sent .time{
  color:rgba(255,255,255,.5);
}
.chat-bubble .seen{
  font-size:10px;
  color:rgba(255,255,255,.2);
  margin-left:4px;
}

/* Typing indicator */
.typing-indicator{
  align-self:flex-start;
  background:var(--glass-strong);
  padding:10px 16px;
  border-radius:18px;
  border-bottom-left-radius:4px;
  display:flex;
  gap:4px;
  align-items:center;
}
.typing-indicator span{
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.3);
  animation:typingBounce 1.4s infinite ease-in-out;
}
.typing-indicator span:nth-child(2){animation-delay:.2s;}
.typing-indicator span:nth-child(3){animation-delay:.4s;}
@keyframes typingBounce{
  0%,60%,100%{transform:translateY(0);opacity:.3;}
  30%{transform:translateY(-6px);opacity:1;}
}

.chat-input-area{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px 10px;
  border-top:1px solid var(--sep);
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(20px);
  flex-shrink:0;
}
.chat-input-area .attach-btn{
  border:none;
  background:transparent;
  color:rgba(255,255,255,.2);
  font-size:20px;
  cursor:pointer;
  padding:4px;
}
.chat-input-area .attach-btn:active{
  transform:scale(.9);
}
.chat-input-area input{
  flex:1;
  height:38px;
  border-radius:20px;
  border:1px solid var(--sep);
  background:var(--glass);
  color:white;
  outline:none;
  padding:0 16px;
  font-size:14px;
  font-family:inherit;
  transition:border-color .3s;
}
.chat-input-area input:focus{
  border-color:var(--blue);
}
.chat-input-area input::placeholder{
  color:rgba(255,255,255,.2);
}
.chat-input-area .send-btn{
  border:none;
  background:var(--blue);
  color:#fff;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
  transition:all .2s;
  display:flex;
  align-items:center;
  justify-content:center;
}
.chat-input-area .send-btn:active{
  transform:scale(.9);
}
.chat-input-area .send-btn:disabled{
  opacity:.3;
  cursor:not-allowed;
}

/* Responsive */
@media (max-width:430px){
  .app-shell{
    max-height:100vh;
    border-radius:0;
  }
}
@media (max-width:380px){
  .message-avatar{
    width:42px;
    height:42px;
    font-size:14px;
  }
  .conversation-top strong{
    font-size:13px;
  }
  .chat-bubble{
    font-size:13px;
    max-width:85%;
  }
}
</style>
</head>
<body>
<div class="app-shell">

  <!-- MAIN LIST -->
  <div id="messagesList">
    <div class="app-header">
      <div class="title"><i class="bi bi-chat-fill"></i> Tin nhắn</div>
      <button class="action-btn" onclick="showToast('💬 Tạo cuộc trò chuyện mới')"><i class="bi bi-pencil-square"></i></button>
    </div>
    <div class="app-body">
      <div class="messages-search">
        <i class="bi bi-search"></i>
        <input id="messageSearch" type="text" placeholder="Tìm kiếm tin nhắn..." oninput="searchMessages()">
      </div>
      <div id="conversationList">
        <!-- Conversations will be rendered by JS -->
      </div>
    </div>
  </div>

  <!-- CHAT VIEW -->
  <div class="messages-chat" id="chatView">
    <div class="chat-header">
      <button class="chat-back" onclick="closeChat()"><i class="bi bi-chevron-left"></i></button>
      <div class="chat-contact">
        <div id="chatAvatar" class="message-avatar blue">A</div>
        <div class="info">
          <span class="name" id="chatName">Anh Tuấn</span>
          <span class="status" id="chatStatus">Đang hoạt động</span>
        </div>
      </div>
      <div class="chat-actions">
        <button onclick="showToast('📞 Đang gọi...')"><i class="bi bi-telephone"></i></button>
        <button onclick="showToast('🔍 Tìm kiếm tin nhắn')"><i class="bi bi-search"></i></button>
      </div>
    </div>
    
    <div class="chat-messages" id="chatMessages"></div>
    
    <div class="chat-input-area">
      <button class="attach-btn" onclick="showToast('📎 Chọn tệp đính kèm')"><i class="bi bi-plus-circle"></i></button>
      <input id="chatInput" type="text" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="bi bi-arrow-up"></i></button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>
</div>

<style>
.toast{
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(30,30,34,.95);
  backdrop-filter:blur(20px);
  padding:10px 20px;
  border-radius:14px;
  font-size:13px;
  color:#fff;
  opacity:0;
  transition:all .3s;
  pointer-events:none;
  z-index:200;
  border:1px solid var(--sep);
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>

<script>
// ================= DATA =================
const conversations = [
  {
    id: 1,
    name: 'Anh Tuấn',
    initial: 'T',
    color: 'blue',
    lastMessage: 'Chào bạn, hẹn gặp nhé!',
    time: '09:42',
    unread: 2,
    online: true,
    messages: [
      { text: 'Chào bạn!', sent: false, time: '09:30' },
      { text: 'Hôm nay bạn có rảnh không?', sent: false, time: '09:35' },
      { text: 'Có, mình rảnh cả ngày', sent: true, time: '09:38' },
      { text: 'Chào bạn, hẹn gặp nhé!', sent: false, time: '09:42' }
    ]
  },
  {
    id: 2,
    name: 'Mai Lan',
    initial: 'L',
    color: 'green',
    lastMessage: 'Cảm ơn bạn đã giúp đỡ!',
    time: '08:15',
    unread: 0,
    online: false,
    messages: [
      { text: 'Bạn ơi, giúp mình với!', sent: false, time: '08:00' },
      { text: 'Có chuyện gì vậy?', sent: true, time: '08:05' },
      { text: 'Mình cần sửa cái này', sent: false, time: '08:08' },
      { text: 'Cảm ơn bạn đã giúp đỡ!', sent: false, time: '08:15' }
    ]
  },
  {
    id: 3,
    name: 'Công ty',
    initial: 'C',
    color: 'pink',
    lastMessage: 'Họp lúc 10h sáng mai',
    time: 'Hôm qua',
    unread: 1,
    online: false,
    messages: [
      { text: 'Lịch họp tuần này', sent: false, time: 'Hôm qua' },
      { text: 'Họp lúc 10h sáng mai', sent: false, time: 'Hôm qua' }
    ]
  },
  {
    id: 4,
    name: 'Team Dev',
    initial: 'D',
    color: 'orange',
    lastMessage: 'Đã merge code xong ✅',
    time: 'Hôm qua',
    unread: 3,
    online: true,
    messages: [
      { text: 'Push code lên chưa?', sent: false, time: 'Hôm qua' },
      { text: 'Rồi, đang review', sent: true, time: 'Hôm qua' },
      { text: 'OK, merge đi', sent: false, time: 'Hôm qua' },
      { text: 'Đã merge code xong ✅', sent: false, time: 'Hôm qua' }
    ]
  },
  {
    id: 5,
    name: 'Mẹ',
    initial: 'M',
    color: 'purple',
    lastMessage: 'Nhớ về ăn cơm tối nhé',
    time: 'Hôm qua',
    unread: 0,
    online: false,
    messages: [
      { text: 'Con ăn cơm chưa?', sent: false, time: 'Hôm qua' },
      { text: 'Dạ chưa ạ', sent: true, time: 'Hôm qua' },
      { text: 'Nhớ về ăn cơm tối nhé', sent: false, time: 'Hôm qua' }
    ]
  }
];

let currentChatId = null;
let chatMessages = {};

// ================= RENDER =================
function renderConversations() {
  const container = document.getElementById('conversationList');
  const searchQuery = document.getElementById('messageSearch').value.toLowerCase().trim();
  
  const filtered = conversations.filter(conv => 
    conv.name.toLowerCase().includes(searchQuery) ||
    conv.lastMessage.toLowerCase().includes(searchQuery)
  );
  
  if (filtered.length === 0) {
    container.innerHTML = `
      <div style="text-align:center;padding:40px 0;color:rgba(255,255,255,.2);font-size:14px;">
        <i class="bi bi-chat" style="font-size:32px;display:block;margin-bottom:8px;color:rgba(255,255,255,.05);"></i>
        Không tìm thấy cuộc trò chuyện
      </div>
    `;
    return;
  }
  
  container.innerHTML = filtered.map(conv => `
    <div class="conversation ${conv.unread > 0 ? 'unread' : ''}" onclick="openChat(${conv.id})">
      <div class="message-avatar ${conv.color}">
        ${conv.initial}
        ${conv.online ? '<span class="online-dot"></span>' : ''}
      </div>
      <div class="conversation-info">
        <div class="conversation-top">
          <strong>${conv.name}</strong>
          <span class="time">${conv.time}</span>
        </div>
        <div class="conversation-bottom">
          ${conv.unread > 0 ? `<span class="unread-badge">${conv.unread}</span>` : ''}
          <span class="message-preview">${conv.lastMessage}</span>
        </div>
      </div>
    </div>
  `).join('');
}

// ================= OPEN/CLOSE CHAT =================
function openChat(id) {
  currentChatId = id;
  const conv = conversations.find(c => c.id === id);
  if (!conv) return;
  
  // Reset unread
  conv.unread = 0;
  
  // Update header
  document.getElementById('chatName').textContent = conv.name;
  document.getElementById('chatStatus').textContent = conv.online ? '🟢 Đang hoạt động' : '🕒 Đã xem';
  const avatar = document.getElementById('chatAvatar');
  avatar.textContent = conv.initial;
  avatar.className = `message-avatar ${conv.color}`;
  
  // Render messages
  const container = document.getElementById('chatMessages');
  container.innerHTML = '';
  
  // Add date divider
  const divider = document.createElement('div');
  divider.className = 'date-divider';
  divider.innerHTML = `<span>Hôm nay</span>`;
  container.appendChild(divider);
  
  conv.messages.forEach(msg => {
    const bubble = document.createElement('div');
    bubble.className = `chat-bubble ${msg.sent ? 'sent' : 'received'}`;
    bubble.innerHTML = `${msg.text} <span class="time">${msg.time}</span>`;
    container.appendChild(bubble);
  });
  
  document.getElementById('chatView').classList.add('open');
  container.scrollTop = container.scrollHeight;
  
  // Focus input
  setTimeout(() => document.getElementById('chatInput').focus(), 200);
  renderConversations();
}

function closeChat() {
  document.getElementById('chatView').classList.remove('open');
  currentChatId = null;
}

// ================= SEND MESSAGE =================
function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || currentChatId === null) return;
  
  const conv = conversations.find(c => c.id === currentChatId);
  if (!conv) return;
  
  // Add user message
  const now = new Date();
  const time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  conv.messages.push({ text, sent: true, time });
  
  // Update last message
  conv.lastMessage = text;
  conv.time = time;
  
  // Add to chat view
  const container = document.getElementById('chatMessages');
  const bubble = document.createElement('div');
  bubble.className = 'chat-bubble sent';
  bubble.innerHTML = `${text} <span class="time">${time}</span>`;
  container.appendChild(bubble);
  container.scrollTop = container.scrollHeight;
  
  input.value = '';
  renderConversations();
  
  // Simulate reply
  setTimeout(() => {
    simulateReply(conv);
  }, 1000 + Math.random() * 1500);
}

function simulateReply(conv) {
  const replies = [
    'Ok nhé 👍', 'Được rồi!', 'Ừ, mình biết rồi.', 'Haha 😄', 
    'Để mình xem nhé.', 'Tuyệt vời!', 'Cảm ơn bạn!', 'Mình đồng ý!',
    'Đang bận tí, lát nữa nhé', 'Chờ mình tí nha'
  ];
  const reply = replies[Math.floor(Math.random() * replies.length)];
  const now = new Date();
  const time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  
  conv.messages.push({ text: reply, sent: false, time });
  conv.lastMessage = reply;
  conv.time = time;
  conv.unread = (conv.unread || 0) + 1;
  
  const container = document.getElementById('chatMessages');
  const bubble = document.createElement('div');
  bubble.className = 'chat-bubble received';
  bubble.innerHTML = `${reply} <span class="time">${time}</span>`;
  container.appendChild(bubble);
  container.scrollTop = container.scrollHeight;
  
  renderConversations();
}

// ================= SEARCH =================
function searchMessages() {
  renderConversations();
}

// ================= TOAST =================
function showToast(message) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ================= KEYBOARD SHORTCUTS =================
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('chatView').classList.contains('open')) {
      closeChat();
    }
  }
});

// ================= INIT =================
renderConversations();
</script>
